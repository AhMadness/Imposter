name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate sample content
        run: python validate_words.py --strict
      - name: Compile source
        run: python -m py_compile main.py content_manager.py validate_words.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
